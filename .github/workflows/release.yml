name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Format, lint and test
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest

      - name: Build release APK
        env:
          TAG: ${{ github.ref_name }}
        run: ./gradlew assembleRelease -PversionTag="$TAG"

      - name: Sign release APK
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SASAYAKI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SASAYAKI_KEYSTORE: ${{ runner.temp }}/release.jks
        run: |
          trap 'rm -f "$SASAYAKI_KEYSTORE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SASAYAKI_KEYSTORE"
          scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk "sasayaki-$TAG.apk"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: sasayaki-${{ github.ref_name }}.apk
          generate_release_notes: true
